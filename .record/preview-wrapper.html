<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Preview</title>
<style>
  html, body { margin: 0; padding: 0; background: #fff; overflow: hidden; }
  .frame {
    width: 1600px;
    height: 2100px;
    overflow: hidden;
    position: relative;
  }
  iframe {
    width: 1600px;
    height: 16000px;
    border: 0;
    position: absolute;
    top: 0;
    left: 0;
  }
</style>
</head>
<body>
  <div class="frame">
    <iframe id="f" src="http://localhost:8080/?_=1" scrolling="no"></iframe>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const y = parseInt(params.get('y') || '0', 10);
    document.getElementById('f').style.top = `-${y}px`;
  </script>
</body>
</html>
