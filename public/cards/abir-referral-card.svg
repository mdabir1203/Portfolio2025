<?xml version="1.0" encoding="UTF-8"?>
<!--
  Abir Referral Card — A6 (105×148mm) LANDSCAPE, double-sided.
  Print: A6 landscape, 300gsm+, double-sided, no fit-to-page, no scaling.
  Bleed: 3mm built in. Safe area: 6mm inset.

  Layout: TWO A6 panels stacked in one SVG (front on top, back on bottom)
  so a designer can proof both sides on one page. Cut along the dashed line.

  Philosophy — a memento, not a flyer.
  ─ FRONT ─ one strong thing. Big monogram. Name in serif italic. One proof line.
  ─ BACK  ─ portrait, one URL, three promises, the QR, the sign-off.
  No overlines, no marketing copy, no "scan me" arrows.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 297 420" width="297mm" height="420mm">
  <defs>
    <style>
      .ink { fill: #0e0e0e; }
      .ink-muted { fill: #5a5a5a; }
      .ink-faint { fill: #8a8a8a; }
      .teal { fill: #0c6b58; }
      .paper { fill: #f7f3ec; }
      .rule { stroke: #0e0e0e; stroke-width: 0.3; }
      .rule-soft { stroke: #cfcdc6; stroke-width: 0.3; }
      .serif { font-family: 'Fraunces', 'Instrument Serif', Georgia, 'Times New Roman', serif; }
      .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, 'Courier New', monospace; }
      .sans { font-family: 'Inter', system-ui, -apple-system, 'Helvetica Neue', sans-serif; }
    </style>
  </defs>

  <!-- ════════════════════ FRONT (top half, 0..210) ════════════════════ -->
  <g>
    <rect width="297" height="210" class="paper"/>

    <g transform="translate(20,20)">
      <!-- Top hairline rule + micro signature -->
      <line x1="0" y1="0" x2="257" y2="0" class="rule"/>
      <text x="0" y="9" class="mono ink-faint" font-size="5.5" letter-spacing="2.2">
        DUBAI · 2026
      </text>
      <text x="257" y="9" class="mono ink-faint" font-size="5.5" letter-spacing="2.2" text-anchor="end">
        A6 · DOUBLE-SIDED
      </text>

      <!-- BIG monogram — anchors the whole front. Centered.
              viewBox of monogram is 64x64. We scale it 1.6× → 102x102, drawn at -y 36 so it sits in the upper third. -->
      <g transform="translate(78, 30)" fill="none" stroke="#0e0e0e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 22 14 L 50 14"/>
        <path d="M 22 14 L 9 80"/>
        <path d="M 50 14 L 63 80"/>
        <path d="M 15 50 L 50 50"/>
        <path d="M 50 50 C 68 50, 80 56, 80 65"/>
        <path d="M 80 65 C 80 75, 68 80, 50 80"/>
      </g>
      <!-- Teal dot — drawn AFTER strokes so it sits on top. -->
      <circle cx="158" cy="95" r="6.5" class="teal"/>

      <!-- Italic serif name — the punchline. Hand-set feel, lower-third. -->
      <text x="128" y="156" class="serif ink" font-size="28" font-weight="500" font-style="italic" text-anchor="middle" letter-spacing="-0.5">
        Mohammad Abir Abbas.
      </text>
      <text x="128" y="168" class="mono ink-muted" font-size="6" letter-spacing="2.5" text-anchor="middle">
        CREATIVE TECHNOLOGIST  ·  AI ARCHITECT
      </text>

      <!-- One proof line — italic, set in teal-accent serif. The whole point of the card. -->
      <line x1="78" y1="180" x2="178" y2="180" class="rule-soft"/>
      <text x="128" y="194" class="serif ink" font-size="9" font-weight="500" text-anchor="middle" font-style="italic">
        Architected the <tspan font-weight="600" fill="#0c6b58">AED 111,246</tspan> Delivery Module
      </text>
      <text x="128" y="204" class="sans ink-muted" font-size="6.5" text-anchor="middle" letter-spacing="0.5">
        Famous Abaya LLC  ·  11.1:1 V:C  ·  MIT Hacknation 2026
      </text>

      <!-- Tear-off stub at the bottom — code + URL. Dashed line above it = the cut. -->
      <line x1="0" y1="221" x2="257" y2="221" stroke="#9a9890" stroke-width="0.4" stroke-dasharray="2 2"/>
      <g transform="translate(0, 230)">
        <text x="0" y="6" class="mono ink-faint" font-size="5.5" letter-spacing="2">
          YOUR CODE
        </text>
        <text x="0" y="18" class="mono ink" font-size="11" font-weight="700" letter-spacing="3">
          ABIR-INTRO
        </text>
        <text x="80" y="6" class="mono ink-faint" font-size="5.5" letter-spacing="2">
          SCAN
        </text>
        <text x="80" y="18" class="serif ink" font-size="11" font-style="italic">
          abir.getwaved.ai/c/intro
        </text>
        <text x="257" y="18" class="mono ink-faint" font-size="5.5" letter-spacing="2" text-anchor="end">
          ✂  TEAR HERE
        </text>
      </g>
    </g>
  </g>

  <!-- ════════════════════ BACK (bottom half, 210..420) ════════════════════ -->
  <g transform="translate(0, 210)">
    <rect width="297" height="210" class="paper"/>

    <g transform="translate(20,20)">
      <!-- Top hairline rule + "from" signature -->
      <line x1="0" y1="0" x2="257" y2="0" class="rule"/>
      <text x="0" y="9" class="mono ink-faint" font-size="5.5" letter-spacing="2.2">
        FROM THE DESK OF
      </text>
      <text x="257" y="9" class="mono ink-faint" font-size="5.5" letter-spacing="2.2" text-anchor="end">
        abir.getwaved.ai
      </text>

      <!-- LEFT COLUMN — the QR, anchored top-left, 88×88pt. -->
      <g transform="translate(0, 22)">
        <image x="0" y="0" width="88" height="88" href="data:image/png;base64,"/>
      </g>
      <text x="0" y="124" class="mono ink-faint" font-size="5.5" letter-spacing="2.2">
        SCAN
      </text>
      <text x="0" y="135" class="serif ink" font-size="9" font-style="italic">
        or open
      </text>
      <text x="0" y="146" class="sans ink" font-size="8" font-weight="500" letter-spacing="-0.2">
        abir.getwaved.ai/c/intro
      </text>

      <!-- 3 stat tiles, even row -->
      <g transform="translate(110, 28)">
        <text x="0" y="0" class="mono ink-faint" font-size="5.5" letter-spacing="2.2">
          THE NUMBERS
        </text>
        <line x1="0" y1="6" x2="148" y2="6" class="rule-soft"/>
        <g transform="translate(0, 18)">
          <text x="0" y="14" class="serif ink" font-size="20" font-weight="500" letter-spacing="-0.5">AED 111K</text>
          <text x="0" y="24" class="sans ink-muted" font-size="6.5">backlog recovered</text>
        </g>
        <g transform="translate(58, 18)">
          <text x="0" y="14" class="serif ink" font-size="20" font-weight="500" letter-spacing="-0.5">11.1:1</text>
          <text x="0" y="24" class="sans ink-muted" font-size="6.5">value : cost</text>
        </g>
        <g transform="translate(110, 18)">
          <text x="0" y="14" class="serif ink" font-size="20" font-weight="500" letter-spacing="-0.5">MIT</text>
          <text x="0" y="24" class="sans ink-muted" font-size="6.5">Hacknation '26</text>
        </g>
      </g>

      <!-- 3 promise lines -->
      <g transform="translate(110, 88)">
        <text x="0" y="0" class="mono ink-faint" font-size="5.5" letter-spacing="2.2">
          15 SECONDS, THREE PROMISES
        </text>
        <line x1="0" y1="6" x2="148" y2="6" class="rule-soft"/>
        <g transform="translate(0, 18)">
          <text x="0" y="0" class="sans ink" font-size="8">
            <tspan font-weight="600">A 30-sec Loom</tspan>
            <tspan fill="#5a5a5a"> of the AED 111K story</tspan>
          </text>
          <text x="0" y="14" class="sans ink" font-size="8">
            <tspan font-weight="600">My live calendar</tspan>
            <tspan fill="#5a5a5a"> — pick a 15-min slot</tspan>
          </text>
          <text x="0" y="28" class="sans ink" font-size="8">
            <tspan font-weight="600">vCard drop</tspan>
            <tspan fill="#5a5a5a"> straight to your phone</tspan>
          </text>
        </g>
      </g>

      <!-- BOTTOM — the sign-off, big -->
      <g transform="translate(0, 184)">
        <line x1="0" y1="0" x2="257" y2="0" class="rule-soft"/>
        <text x="0" y="10" class="mono ink-muted" font-size="5.5" letter-spacing="2.2">
          NO NEWSLETTER  ·  NO SPAM  ·  UNSUBSCRIBE WITH ONE TAP
        </text>
      </g>
    </g>
  </g>

  <!-- cut line between front and back -->
  <line x1="0" y1="210" x2="297" y2="210" stroke="#cfcdc6" stroke-width="0.4" stroke-dasharray="2 2"/>
</svg>
